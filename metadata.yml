Status: Ready
Title: PyMolGen Drug-Like Molecule Generation
Description: Assembles up to 100 drug-like molecules by drawing fragments from a
  curated database and joining them at compatible attachment points. PyMolGen 
  takes a database-driven route rather than a learned one, so generated 
  structures are built from pieces that already occur in real compounds and 
  inherit their chemical plausibility. Novelty is bounded by the fragment 
  library, and the resulting molecules should still be filtered for synthetic 
  accessibility and undesirable substructures.
