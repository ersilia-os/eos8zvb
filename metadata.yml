Identifier: eos8zvb
Slug: pymolgen
Status: Ready
Title: PyMolGen Drug-Like Molecule Generation
Description: Generates drug-like molecules from a parent compound by deriving 
  fragment combination rules from a molecular database (ChEMBL). Starting from a
  core structure, new analogues are randomly sampled according to the source 
  databases fragment-bond frequencies, deduplicated, and checked for RDKit 
  validity. Each output is a distinct generated analogue of the input compound.
