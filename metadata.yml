Status: Ready
Title: PyMolGen Drug-Like Molecule Generation
Description: Grows up to 100 drug-like analogues of an input compound by joining fragments
  according to combination rules mined from a source database, in this case the 2.3
  million compounds of ChEMBL, so bonds form only between fragment pairs that occur
  there. PyMolGen is rule-based rather than learned, which gives more control over
  the output than a generative network but bounds novelty by the fragment library.
  Growth is random and unseeded; results are deduplicated, checked with RDKit, never
  equal to the input and ordered by similarity to it.
